# Weekly dependency updates, grouped so they arrive as a few pull requests.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    ignore:
      # The runtime is Node 24 LTS (ADR-0007); its type definitions move with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      next-and-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      web-tooling:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/services/api, /apps/web]
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    ignore:
      # Runtimes are pinned on purpose (ADR-0007): Node 24 LTS until Node 26 is the
      # active LTS line, Python 3.12 (as in .python-version), and uv in step with CI.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "*astral-sh/uv"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/bootstrap
      - /infra/terraform/envs/staging
      - /infra/terraform/modules/cloud-run-service
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    groups:
      providers:
        patterns: ["*"]
