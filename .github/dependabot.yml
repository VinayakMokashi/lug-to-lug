# Weekly dependency updates, grouped so they arrive as a few pull requests.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    groups:
      next-and-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      web-tooling:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/services/api, /apps/web]
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/bootstrap
      - /infra/terraform/envs/staging
      - /infra/terraform/modules/cloud-run-service
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    groups:
      providers:
        patterns: ["*"]
