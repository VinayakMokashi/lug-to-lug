name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy both services to staging even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to find the last green run on main
    outputs:
      python: ${{ steps.filter.outputs.python }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v7
      # On main, compare with the last commit whose push run passed, not only with the
      # previous push. When merges land quickly GitHub cancels a waiting run, and that
      # commit's changes would otherwise never be checked or deployed.
      - name: Find the last green commit on main
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          echo "sha=${sha:-$BEFORE}" >> "$GITHUB_OUTPUT"
          echo "Changes are detected against ${sha:-$BEFORE}"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            python:
              - "packages/**"
              - "services/**"
              - "tools/**"
              - "ml/**"
              - "scripts/**"
              - "data/schemas/**"
              - "data/catalogue/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".python-version"
              - ".github/workflows/ci.yml"
              - ".github/workflows/deploy-service.yml"
            # What goes into the API image: only these redeploy it.
            api:
              - "packages/core/**"
              - "services/api/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".python-version"
              - ".github/workflows/ci.yml"
              - ".github/workflows/deploy-service.yml"
            web:
              - "apps/web/**"
              - "data/schemas/**"
              - ".github/workflows/ci.yml"
              - ".github/workflows/deploy-service.yml"
            terraform:
              - "infra/terraform/**"
              - ".github/workflows/ci.yml"

  hooks:
    name: Hooks and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan reads the whole history
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.19"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # The gitleaks hook scans staged changes only, which CI has none of; the
      # full-history scan below covers it.
      - name: pre-commit (all files)
        run: SKIP=gitleaks uv tool run pre-commit run --all-files --show-diff-on-failure
      - name: Secret scan (full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$file"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$file" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose "$GITHUB_WORKSPACE"

  python:
    name: Python (lint, types, tests)
    needs: changes
    if: needs.changes.outputs.python == 'true' || inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run poe lint
      - run: uv run poe types
      - run: uv run poe contracts-check
      - run: uv run pytest --cov=lugtolug_core --cov=lugtolug_api --cov=lugtolug_tools --cov=lugtolug_ml --cov-report=term-missing

  web:
    name: Web (lint, types, build)
    needs: changes
    if: needs.changes.outputs.web == 'true' || inputs.deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  terraform:
    name: Terraform (format, validate)
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate each root
        run: |
          for root in infra/terraform/bootstrap infra/terraform/envs/staging; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

  # One check to require on pull requests: it passes when every job passed or was
  # skipped by the path filters.
  ci-ok:
    name: CI passed
    if: always()
    needs: [hooks, python, web, terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Check the job results
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"

  # Continuous delivery to staging: only from main, only after the checks pass, and only
  # for the services whose files changed. The API goes first, so the web app's smoke
  # test reaches the new API.
  deploy-api:
    name: Deploy API
    needs: [changes, hooks, python]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.hooks.result == 'success' && needs.python.result == 'success' &&
      (needs.changes.outputs.api == 'true' || inputs.deploy)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: api
      context: .
      dockerfile: services/api/Dockerfile

  deploy-web:
    name: Deploy web
    needs: [changes, hooks, web, deploy-api]
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.hooks.result == 'success' && needs.web.result == 'success' &&
      needs.deploy-api.result != 'failure' && needs.deploy-api.result != 'cancelled'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: web
      context: apps/web
      dockerfile: apps/web/Dockerfile
