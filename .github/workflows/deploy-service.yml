# Build one service's image, push it to Artifact Registry, roll it out to Cloud Run and
# smoke-test it. Called from CI after the checks pass on main. Authentication is keyless:
# GitHub's OIDC token is exchanged for a short-lived token of the deployer account.
name: Deploy a service

on:
  workflow_call:
    inputs:
      service:
        description: "Service to deploy: api or web"
        type: string
        required: true
      context:
        description: "Docker build context"
        type: string
        required: true
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        required: true
      environment:
        description: "Target environment; the Cloud Run service is <service>-<environment>"
        type: string
        default: staging

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: ${{ inputs.service }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.rollout.outputs.url }}
    env:
      IMAGE: ${{ vars.GCP_REGISTRY }}/${{ inputs.service }}:${{ github.sha }}
      SERVICE: ${{ inputs.service }}-${{ inputs.environment }}
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ env.IMAGE }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - uses: google-github-actions/setup-gcloud@v3

      - id: rollout
        name: Roll out the new revision
        run: |
          gcloud run services update "$SERVICE" --image="$IMAGE" \
            --region="$REGION" --project="$PROJECT" --quiet
          url=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROJECT" --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: "Smoke test: /health reports this commit"
        env:
          URL: ${{ steps.rollout.outputs.url }}
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$URL/health" | tee health.json
          echo
          jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .git_sha == $sha' health.json

      - name: "Smoke test: the web app reaches the API"
        if: inputs.service == 'web'
        env:
          URL: ${{ steps.rollout.outputs.url }}
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$URL/status" -o status.html
          grep -q "Round trip" status.html || { echo "The status page could not reach the API"; exit 1; }
