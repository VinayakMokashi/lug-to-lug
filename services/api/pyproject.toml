[project]
name = "lugtolug-api"
version = "0.1.0"
description = "HTTP API for Lug to Lug: measure, try on, fit, search"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.162.0",
    "lugtolug-core",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
lugtolug-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"
