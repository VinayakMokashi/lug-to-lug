[project]
name = "lugtolug-ml"
version = "0.1.0"
description = "Training data and model code for Lug to Lug, starting with synthetic data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["lugtolug-core", "numpy>=2.5.4", "pillow>=13.0.0"]

[tool.uv.sources]
lugtolug-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"
