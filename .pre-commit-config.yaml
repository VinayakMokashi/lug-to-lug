# Hooks run on every commit once installed (`pre-commit install`), and in CI on all
# files. Versions are bumped with `pre-commit autoupdate`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--allow-multiple-documents] # pnpm lockfiles are multi-document
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.19
    hooks:
      - id: uv-lock

  # Secret scan of the staged changes.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-photos-in-data
        name: no photos under data/ (ADR-0006)
        language: fail
        entry: Photos never enter the repository; keep them in the private photo store (ADR-0006).
        files: (?i)^data/.*\.(jpe?g|png|webp|heic|heif|dng|tiff?)$
